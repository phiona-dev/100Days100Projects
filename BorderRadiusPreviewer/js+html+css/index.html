<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="main-content">
            <h1>Border Radius Previewer</h1>

            <div>
                <h4>Properties in px </h4>
                <label>Top-left: </label>
                <input type="text" id="top-left"/>

                <label>Top-Right: </label>
                <input type="text" id="top-right"/>

                <label>Bottom-Right: </label>
                <input type="text" id="bottom-right"/>

                <label>Bottom-Left:</label>
                <input type="text" id="bottom-left"/>

                <button id="apply-changes">Apply Changes</button>
            </div>

            <div>
                <button id="button-previewer"></button>
            </div>

            <div>
                <h4>Style</h4>
                <div class="styling"></div>
                <button id="copy-btn">Copy</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
